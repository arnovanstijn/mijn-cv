<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mijn CV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contact opnemen</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="mijncv.html">Mijn CV</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Stuur mij een bericht</h2>
        <form action="#" method="post">
            <label for="voornaam">Voornaam:</label>
            <input type="text" id="voornaam" name="voornaam" placeholder="Uw voornaam" required>

            <label for="achternaam">Achternaam:</label>
            <input type="text" id="achternaam" name="achternaam" placeholder="Uw achternaam" required>

            <label for="email">E-mailadres:</label>
            <input type="email" id="email" name="email" placeholder="naam@voorbeeld.nl" required>

            <label for="bericht">Bericht:</label>
            <textarea id="bericht" name="bericht" rows="5" placeholder="Typ hier uw bericht..." required></textarea>

            <button type="submit">Verzend bericht</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Arno van Stijn - Alle rechten voorbehouden</p>
    </footer>
</body>
</html>
